<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>مساعد سحاب | شاشات وقطع غيار الجوال</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;600&display=swap">
  <style>
    :root {
      --mat: #DFE6F3;
      --bezel: #0E1B4D;
      --screen: #050608;
      --panel: #14171D;
      --brand-bg: #F1F2F7;
      --ink: #EEF1F8;
      --muted: #9AA3B8;
      --line: #262B36;
      --accent: #1F4FD6;
      --accent2: #3E86F2;
      --accent-ink: #FFFFFF;
      --amber: #3E86F2;
      --err: #F2918A;
      --grad: linear-gradient(135deg, #1F4FD6, #3E86F2);
    }

    @media (max-width:599px) {

      html,
      body {
        background: var(--panel)
      }
    }

    * {
      box-sizing: border-box
    }

    html,
    body {
      height: 100%;
      height: 100dvh;
      margin: 0;
    }

    body {
      background: var(--mat);
      font-family: "IBM Plex Sans Arabic", Tahoma, sans-serif;
      color: var(--ink);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* إطار الجوال: يتكيف بمرونة على جميع الأجهزة والشاشات */
    .phone {
      width: 100%;
      height: 100%;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      background: var(--screen);
      position: relative;
      overflow: hidden;
    }

    @media (min-width:600px) {
      .phone {
        width: 420px;
        max-width: 95vw;
        height: 800px;
        max-height: 94vh;
        border-radius: 40px;
        border: 8px solid var(--bezel);
        box-shadow: 0 25px 60px rgba(14, 27, 77, .32);
      }

      .phone::before {
        content: "";
        position: absolute;
        top: 8px;
        left: 50%;
        transform: translateX(-50%);
        width: 90px;
        height: 22px;
        border-radius: 12px;
        background: var(--bezel);
        z-index: 5;
      }

      header {
        padding-top: 40px !important;
      }
    }

    header {
      padding: calc(10px + env(safe-area-inset-top, 0px)) 16px 10px;
      border-bottom: 1px solid var(--line);
      background: var(--panel);
      display: flex;
      align-items: center;
      gap: 12px
    }

    header img {
      height: 52px;
      width: auto;
      display: block;
      border-radius: 12px
    }

    header h1 {
      margin: 0;
      font-size: 1.02rem;
      font-weight: 600;
      color: var(--ink)
    }

    header p {
      margin: 2px 0 0;
      color: var(--muted);
      font-size: .78rem
    }

    .contact {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 14px;
      background: var(--panel);
      border-bottom: 1px solid var(--line)
    }

    .contact span {
      flex: 1;
      font-size: .8rem;
      color: var(--muted)
    }

    .contact b {
      color: var(--ink);
      font-weight: 600;
      direction: ltr;
      unicode-bidi: embed
    }

    .contact a {
      text-decoration: none;
      font-size: .82rem;
      font-weight: 600;
      padding: 7px 12px;
      border-radius: 10px
    }

    .contact .wa {
      border: 1px solid var(--accent2);
      color: var(--accent2)
    }

    .contact .call {
      background: var(--grad);
      color: var(--accent-ink)
    }

    .contact a:focus-visible {
      outline: 2px solid var(--accent2);
      outline-offset: 2px
    }

    #log {
      flex: 1;
      overflow-y: auto;
      padding: 14px 14px 6px;
      display: flex;
      flex-direction: column;
      gap: 10px
    }

    .msg {
      max-width: 88%;
      padding: 10px 14px;
      border-radius: 16px;
      line-height: 1.8;
      font-size: .93rem;
      overflow-wrap: anywhere
    }

    .user {
      align-self: flex-start;
      background: var(--grad);
      color: var(--accent-ink);
      border-end-start-radius: 4px;
      white-space: pre-wrap
    }

    .bot {
      align-self: flex-end;
      background: var(--panel);
      border: 1px solid var(--line);
      border-end-end-radius: 4px
    }

    .bot p {
      margin: 0 0 .5em
    }

    .bot p:last-child {
      margin: 0
    }

    .bot ul {
      margin: .3em 0 .5em;
      padding-inline-start: 1.2em
    }

    .bot.error {
      color: var(--err);
      border-color: var(--err)
    }

    .welcome {
      margin: auto 0 0;
      text-align: right
    }

    .welcome h2 {
      margin: 0 0 4px;
      font-size: 1.1rem
    }

    .welcome p {
      margin: 0 0 12px;
      color: var(--muted);
      font-size: .88rem
    }

    .chips {
      display: flex;
      flex-wrap: wrap;
      gap: 8px
    }

    .chip {
      border: 1px solid var(--line);
      background: var(--panel);
      color: var(--ink);
      padding: 8px 12px;
      border-radius: 12px;
      font: inherit;
      font-size: .84rem;
      cursor: pointer;
      text-align: right
    }

    .chip:hover {
      border-color: var(--accent2)
    }

    .dots span {
      display: inline-block;
      width: 7px;
      height: 7px;
      margin: 0 2px;
      border-radius: 50%;
      background: var(--amber);
      animation: b 1s infinite
    }

    .dots span:nth-child(2) {
      animation-delay: .15s
    }

    .dots span:nth-child(3) {
      animation-delay: .3s
    }

    @keyframes b {

      0%,
      80%,
      100% {
        opacity: .3
      }

      40% {
        opacity: 1
      }
    }

    @media (prefers-reduced-motion:reduce) {
      .dots span {
        animation: none;
        opacity: .7
      }
    }

    .composer {
      display: flex;
      gap: 8px;
      padding: 10px 12px calc(12px + env(safe-area-inset-bottom, 0px));
      background: var(--panel);
      border-top: 1px solid var(--line);
      align-items: flex-end
    }

    textarea {
      flex: 1;
      resize: none;
      max-height: 110px;
      padding: 10px 13px;
      border-radius: 14px;
      border: 1px solid var(--line);
      background: var(--screen);
      color: var(--ink);
      font: inherit;
      font-size: 16px;
      line-height: 1.6;
    }

    textarea:focus-visible,
    button:focus-visible {
      outline: 2px solid var(--accent2);
      outline-offset: 2px
    }

    #send {
      border: 0;
      border-radius: 14px;
      padding: 10px 18px;
      background: var(--grad);
      color: var(--accent-ink);
      font: inherit;
      font-weight: 600;
      cursor: pointer
    }

    #send:disabled {
      opacity: .5;
      cursor: not-allowed
    }
  </style>
</head>

      <div>
        <h1>مساعد سحاب</h1>
        <p>شاشات وقطع غيار الجوال</p>
      </div>
    </header>
    <div class="contact">
      <span>للطلب والاستفسار: <b id="phoneText"></b></span>
      <a class="wa" id="waLink" target="_blank" rel="noopener">واتساب</a>
      <a class="call" id="callLink">اتصال</a>
    </div>

    <div id="log" aria-live="polite">
      <div class="welcome" id="welcome">
        <h2>وش القطعة اللي تدور عليها؟</h2>
        <p>اكتب موديل جوالك واللي تبيه، أو اختر سؤال من تحت.</p>
        <div class="chips" id="chips"></div>
      </div>
    </div>

    <div class="composer">
      <textarea id="input" rows="1" placeholder="مثال: أفضل شاشة لآيفون 13" aria-label="سؤالك"></textarea>
      <button id="send">إرسال</button>
    </div>
  </div>

  <script>
    /* ===== الإعدادات ===== */
    // مفتاح Gemini API (مفعّل ومضبوط ليعمل تلقائياً محلياً وعبر الإنترنت):
    const GEMINI_API_KEY = atob("QVEuQWI4Uk42SXMtOFREMjFNY1B6cXJZWW1nc3ZxRjdONDRFVGJJeU5xVklHSjNJdzN0dUE=");
    const GEMINI_MODEL = "gemini-3.1-flash-lite";

    // رابط الـ Cloudflare Worker (اختياري - اتركه فارغاً إذا كنت تستخدم المفتاح المباشر):
    const WORKER_URL = "";

    // رقم التواصل. رمز الدولة 967 (اليمن): غيّره إذا رقمك من دولة ثانية
    const PHONE = "778267604";
    const COUNTRY_CODE = "967";

    const SYSTEM_PROMPT = `أنت مساعد خبير في شاشات الجوالات وقطع غيارها (شاشات، بطاريات، منافذ شحن، كاميرات، سماعات، أغطية خلفية، وغيرها) لمركز "سحاب".
- أجب بنفس لغة ولهجة السائل، وبأسلوب واضح ومختصر ومباشر.
- وضّح الفرق بين أنواع الشاشات (أصلية، OLED، Incell، TFT، معاد تصنيعها) مع المميزات والعيوب، وارشد السائل لأفضل خيار حسب الميزانية والموديل.
- اطلب موديل الجوال بالضبط إذا لم يذكره لتحديد التوافق والسعر بدقة.
- بخصوص الأسعار: عند سؤال السائل عن السعر، قدّم تقديراً سعرياً تقريبياً بناءً على فئة القطعة وجودتها ونوع الجوال (بالريال السعودي أو الدولار أو الريال اليمني حسب الاستفسار)، ووضّح الفارق بين سعر التجاري والاقتصادي (Incell) والمتوسط (OLED) والأصلي.
- نبّه دائماً بلطف أن "الأسعار تقريبية وقابلة للتغيير حسب الموديل الدقيق وتغيرات سعر الصرف والسوق"، ولتأكيد السعر النهائي والتوفر، وجّهه للتواصل مباشرة مع سحاب عبر الرقم 778267604 (واتساب أو اتصال).
- إذا كان السؤال خارج موضوع الجوالات وقطع غيارها، اعتذر بلطف وأعد توجيه السائل للموضوع.`;

    const SUGGESTIONS = [
      "كم سعر شاشة آيفون 11 تقريباً؟",
      "وش الفرق بين OLED وIncell وTFT؟",
      "أفضل شاشة بديلة لآيفون 13",
      "متى أغيّر بطارية جوالي؟"
    ];
    /* ==================== */

    document.getElementById("phoneText").textContent = PHONE;
    document.getElementById("waLink").href = "https://wa.me/" + COUNTRY_CODE + PHONE;
    document.getElementById("callLink").href = "tel:+" + COUNTRY_CODE + PHONE;

    const log = document.getElementById("log");
    const input = document.getElementById("input");
    const sendBtn = document.getElementById("send");
    const history = [];

    document.getElementById("chips").append(...SUGGESTIONS.map(s => {
      const b = document.createElement("button");
      b.className = "chip"; b.textContent = s;
      b.onclick = () => { input.value = s; send(); };
      return b;
    }));

    function esc(t) { return t.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;"); }
    function inline(t) {
      return esc(t)
        .replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>")
        .replace(/\*(.+?)\*/g, "<em>$1</em>");
    }

    // عرض آمن مبسّط للنص: عناوين وفقرات وقوائم وخط عريض
    function render(el, text) {
      el.textContent = "";
      let ul = null;
      text.split("\n").forEach(line => {
        const trimmed = line.trim();
        const headerMatch = trimmed.match(/^#{1,3}\s+(.*)/);
        const listMatch = line.match(/^\s*[*\-•]\s+(.*)/);
        if (headerMatch) {
          ul = null;
          const h = document.createElement("div");
          h.style.fontWeight = "bold";
          h.style.margin = "10px 0 4px";
          h.style.fontSize = "1.05em";
          h.innerHTML = inline(headerMatch[1]);
          el.appendChild(h);
        } else if (listMatch) {
          if (!ul) { ul = document.createElement("ul"); el.appendChild(ul); }
          const li = document.createElement("li"); li.innerHTML = inline(listMatch[1]); ul.appendChild(li);
        } else if (trimmed) {
          ul = null;
          const p = document.createElement("p"); p.innerHTML = inline(trimmed); el.appendChild(p);
        } else {
          ul = null;
        }
      });
    }

    function add(text, cls) {
      const w = document.getElementById("welcome");
      if (w) w.remove();
      const d = document.createElement("div");
      d.className = "msg " + cls;
      if (cls === "user") d.textContent = text;
      log.appendChild(d);
      log.scrollTop = log.scrollHeight;
      return d;
    }

    async function askGemini(contents) {
      // 1. إذا كان الموقع منشوراً على Vercel ولديه مسار /api/chat، نستخدمه
      if (window.location.protocol.startsWith("http") && window.location.hostname.includes("vercel.app")) {
        try {
          const apiRes = await fetch("/api/chat", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ contents }),
          });
          if (apiRes.ok) {
            const data = await apiRes.json();
            if (data.text) return data.text;
          }
        } catch (_) {}
      }

      // 2. إذا كان رابط Cloudflare Worker محدد ومضبوط، نطلبه
      if (WORKER_URL && !WORKER_URL.includes("your-worker-name")) {
        const response = await fetch(WORKER_URL, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ contents }),
        });
        if (!response.ok) {
          const errData = await response.json().catch(() => ({}));
          throw new Error(errData.error || `خطأ في الاتصال بالخادم (${response.status})`);
        }
        const data = await response.json();
        return data.text;
      }

      // 3. الاتصال المباشر بـ Google Gemini API (للعمل المحلي دون خادم)
      if (GEMINI_API_KEY) {
        const cleanContents = contents.slice(-20).map(m => ({
          role: m.role,
          parts: [{ text: m.parts[0]?.text || "" }]
        }));

        const url = `https://generativelanguage.googleapis.com/v1beta/models/${GEMINI_MODEL}:generateContent?key=${GEMINI_API_KEY}`;
        const response = await fetch(url, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            systemInstruction: { parts: [{ text: SYSTEM_PROMPT }] },
            contents: cleanContents,
            generationConfig: {
              maxOutputTokens: 800,
              thinkingConfig: { thinkingBudget: 0 }
            }
          }),
        });

        if (!response.ok) {
          const errData = await response.json().catch(() => ({}));
          const errMsg = errData.error?.message || `خطأ في الاتصال بـ Gemini (${response.status})`;
          throw new Error(errMsg);
        }

        const data = await response.json();
        const parts = data.candidates?.[0]?.content?.parts;
        const answer = parts ? parts.map(p => p.text || "").join("") : "لم يتم استلام رد، جرّب صياغة أخرى.";
        return answer;
      }

      throw new Error("يرجى وضع مفتاح Gemini API أو رابط خادم API للتشغيل.");
    }

    async function send() {
      const q = input.value.trim();
      if (!q || sendBtn.disabled) return;
      input.value = ""; input.style.height = "auto";
      add(q, "user");
      history.push({ role: "user", parts: [{ text: q }] });
      sendBtn.disabled = true;
      const wait = add("", "bot");
      wait.innerHTML = '<span class="dots"><span></span><span></span><span></span></span>';
      try {
        const answer = await askGemini(history);
        render(wait, answer);
        history.push({ role: "model", parts: [{ text: answer }] });
      } catch (e) {
        history.pop();
        wait.textContent = e.message || "صار خطأ. جرّب مرة ثانية.";
        wait.classList.add("error");
      }
      sendBtn.disabled = false;
      input.focus();
      log.scrollTop = log.scrollHeight;
    }

    sendBtn.addEventListener("click", send);
    input.addEventListener("keydown", e => {
      if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(); }
    });
    input.addEventListener("input", () => {
      input.style.height = "auto";
      input.style.height = Math.min(input.scrollHeight, 110) + "px";
    });
  </script>
</body>

</html>
